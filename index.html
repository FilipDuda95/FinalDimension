<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perspektivní Prohlížeč — Index Nekonečno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #333333 55%, #000000 100%);
            touch-action: manipulation;
        }

        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: hidden;
        }

        /* Mraky před stránkou */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 15;
            transition: opacity 0.3s ease;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 100px;
            filter: blur(40px);
        }

        .cloud:nth-child(1) {
            width: 400px;
            height: 140px;
            top: 10%;
            left: -100px;
            animation: drift 22s infinite ease-in-out;
        }

        .cloud:nth-child(2) {
            width: 350px;
            height: 120px;
            top: 40%;
            right: -80px;
            animation: drift 28s infinite ease-in-out reverse;
            animation-delay: 3s;
        }

        .cloud:nth-child(3) {
            width: 300px;
            height: 100px;
            top: 65%;
            left: 15%;
            animation: drift 25s infinite ease-in-out;
            animation-delay: 7s;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(120px) translateY(-20px); }
        }

        /* 3D Kontejner pro okno i obsah */
        .viewport-wrapper {
            position: relative;
            z-index: 5;
            width: 85%;
            height: 80%;
            max-width: 1100px;
            max-height: 800px;
            transform-style: preserve-3d;
            transition: transform 0.3s ease-out, width 0.3s ease, height 0.3s ease, max-width 0.3s ease, max-height 0.3s ease;
        }

        /* Režim celé obrazovky pro iframe kontejner */
        .viewport-wrapper.fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            transform: none !important;
            z-index: 30;
        }

        .viewport-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            box-shadow: 0 30px 90px rgba(0,0,0,0.85);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.35s ease, opacity 0.35s ease, border-radius 0.3s ease;
        }

        .viewport-wrapper.fullscreen .viewport-frame {
            border-radius: 0;
            box-shadow: none;
        }

        /* Třídy pro animovaný přechod stránek */
        .slide-out-left {
            transform: translateX(-120%) rotateY(-15deg);
            opacity: 0;
        }

        .slide-out-right {
            transform: translateX(120%) rotateY(15deg);
            opacity: 0;
        }

        .slide-in-left {
            animation: slideInFromLeft 0.35s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-in-right {
            animation: slideInFromRight 0.35s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-120%) rotateY(-15deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0deg); opacity: 1; }
        }

        @keyframes slideInFromRight {
            from { transform: translateX(120%) rotateY(15deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0deg); opacity: 1; }
        }

        /* Iframe */
        .viewport-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            pointer-events: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }

        .viewport-iframe::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Šipky pro posun stránek */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            transition: all 0.2s ease;
            user-select: none;
            z-index: 25;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }

        .nav-arrow:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
            color: #4facfe;
        }

        .nav-arrow.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        .nav-arrow.left { left: 30px; }
        .nav-arrow.right { right: 30px; }

        /* Ovládací panel */
        .controls-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            z-index: 40;
            background: rgba(18, 18, 18, 0.85);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            height: 52px;
            max-width: calc(100vw - 20px);
            transition: left 0.3s ease, transform 0.3s ease, bottom 0.3s ease;
        }

        .panel-box {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 100%;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            transition: background 0.2s, transform 0.1s, color 0.2s;
            flex-shrink: 0;
        }

        .control-btn:hover { 
            background: rgba(255, 255, 255, 0.25);
            color: #4facfe;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        /* SVG ikona v tlačítku */
        .control-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .rotate-panel {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            height: 100%;
        }

        .rotate-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rotate-label {
            font-size: 11px;
            color: #aaa;
            font-weight: 700;
            text-transform: uppercase;
        }

        .rotate-slider {
            width: 60px;
            cursor: pointer;
            accent-color: #4facfe;
        }

        .rotate-value {
            font-size: 11px;
            color: #fff;
            font-weight: 600;
            min-width: 24px;
            font-family: monospace;
            text-align: right;
        }

        /* Ukrytí prvků při aktivní lupě */
        body.is-fullscreen .nav-arrow,
        body.is-fullscreen .zoom-panel,
        body.is-fullscreen .rotate-panel,
        body.is-fullscreen .clouds {
            display: none !important;
        }

        /* POSUNITO O 20PX DOPRAVA: left upraven z 24px na 44px */
        body.is-fullscreen .controls-container {
            left: 44px !important;
            bottom: 5% !important;
            transform: none !important;
        }

        /* Responzivita pro telefony */
        @media (max-width: 768px) and (orientation: portrait) {
            .viewport-wrapper {
                width: 92vw;
                height: 76vh;
            }

            .nav-arrow {
                width: 42px;
                height: 42px;
                font-size: 22px;
            }
            .nav-arrow.left { left: 8px; }
            .nav-arrow.right { right: 8px; }

            .controls-container {
                bottom: 12px;
                gap: 4px;
                padding: 4px;
                height: 46px;
                max-width: calc(100vw - 16px);
            }

            /* Na mobilu posunuto o 20px doprava: left upraven z 14px na 34px */
            body.is-fullscreen .controls-container {
                left: 34px !important;
                bottom: 5% !important;
            }

            .control-btn {
                width: 36px;
                height: 36px;
                min-width: 36px;
                font-size: 16px;
            }

            .control-btn svg {
                width: 16px;
                height: 16px;
            }

            .rotate-panel {
                gap: 6px;
                padding: 0 2px;
            }

            .rotate-slider {
                width: 40px;
            }

            .rotate-value {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div class="scene">
        <div class="viewport-wrapper" id="viewportWrapper">
            <div class="viewport-frame" id="viewportFrame">
                <iframe 
                    class="viewport-iframe" 
                    id="contentIframe"
                    src="index1.html"
                ></iframe>
            </div>
        </div>

        <div class="nav-arrow left" id="navLeft">‹</div>
        <div class="nav-arrow right" id="navRight">›</div>

        <div class="controls-container">
            <div class="panel-box zoom-panel">
                <button class="control-btn" id="zoomIn" title="Přiblížit">+</button>
                <button class="control-btn" id="zoomOut" title="Oddálit">−</button>
            </div>

            <div class="panel-box rotate-panel">
                <div class="rotate-row">
                    <span class="rotate-label">Y</span>
                    <input type="range" class="rotate-slider" id="rotateYSlider" min="-45" max="45" value="0">
                    <span class="rotate-value" id="rotateYValue">0°</span>
                </div>
                <div class="rotate-row">
                    <span class="rotate-label">X</span>
                    <input type="range" class="rotate-slider" id="rotateXSlider" min="-45" max="45" value="12">
                    <span class="rotate-value" id="rotateXValue">12°</span>
                </div>
            </div>

            <div class="panel-box">
                <button class="control-btn" id="toggleFullscreen" title="Zvětšit na celou obrazovku">
                    <!-- SVG Lupa (plus) -->
                    <svg id="searchIcon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const viewportWrapper = document.getElementById('viewportWrapper');
        const viewportFrame = document.getElementById('viewportFrame');
        const iframe = document.getElementById('contentIframe');
        
        const rotateYSlider = document.getElementById('rotateYSlider');
        const rotateYValue = document.getElementById('rotateYValue');
        const rotateXSlider = document.getElementById('rotateXSlider');
        const rotateXValue = document.getElementById('rotateXValue');
        
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const navLeft = document.getElementById('navLeft');
        const navRight = document.getElementById('navRight');
        const toggleFullscreen = document.getElementById('toggleFullscreen');
        const searchIcon = document.getElementById('searchIcon');

        let currentIndex = 1;
        let zoomLevel = 1;
        let rotationY = 0;
        let rotationX = window.innerWidth <= 768 ? 6 : 12;
        let availablePages = [];
        let isAnimating = false;
        let isFullscreen = false;

        rotateXSlider.value = rotationX;
        rotateXValue.textContent = `${rotationX}°`;

        async function checkPages() {
            availablePages = [];
            let i = 1;
            
            while (i <= 100) {
                const filename = `index${i}.html`;
                try {
                    const res = await fetch(filename, { method: 'HEAD' });
                    if (res.ok) {
                        availablePages.push(i);
                        i++;
                    } else {
                        break;
                    }
                } catch (e) {
                    break;
                }
            }

            if (availablePages.length === 0) {
                availablePages = [1, 2, 3];
            }

            updateNavButtons();
        }

        function updateNavButtons() {
            const pos = availablePages.indexOf(currentIndex);
            
            if (pos <= 0) {
                navLeft.classList.add('disabled');
            } else {
                navLeft.classList.remove('disabled');
            }

            if (pos >= availablePages.length - 1) {
                navRight.classList.add('disabled');
            } else {
                navRight.classList.remove('disabled');
            }
        }

        function updateView() {
            if (isFullscreen) return;
            viewportWrapper.style.transform = `
                rotateX(${rotationX}deg) 
                rotateY(${rotationY}deg) 
                scale(${zoomLevel})
            `;
        }

        function navigateTo(targetIndex, direction) {
            if (isAnimating || targetIndex === currentIndex) return;
            isAnimating = true;

            const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
            const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

            viewportFrame.className = `viewport-frame ${outClass}`;

            setTimeout(() => {
                currentIndex = targetIndex;
                iframe.src = `index${currentIndex}.html`;
                updateNavButtons();

                viewportFrame.className = `viewport-frame ${inClass}`;

                setTimeout(() => {
                    viewportFrame.className = 'viewport-frame';
                    isAnimating = false;
                }, 350);
            }, 350);
        }

        /* Přepínání režimu lupy / Fullscreen */
        toggleFullscreen.addEventListener('click', () => {
            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                document.body.classList.add('is-fullscreen');
                viewportWrapper.classList.add('fullscreen');
                // Změna ikonky na lupu mínus
                searchIcon.innerHTML = `
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                `;
                toggleFullscreen.title = 'Zmenšit zpět';
            } else {
                document.body.classList.remove('is-fullscreen');
                viewportWrapper.classList.remove('fullscreen');
                // Změna ikonky zpět na lupu plus
                searchIcon.innerHTML = `
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                `;
                toggleFullscreen.title = 'Zvětšit na celou obrazovku';
                updateView();
            }
        });

        zoomIn.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 0.1, 1.8);
            updateView();
        });

        zoomOut.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            updateView();
        });

        rotateYSlider.addEventListener('input', (e) => {
            rotationY = parseInt(e.target.value, 10);
            rotateYValue.textContent = `${rotationY}°`;
            updateView();
        });

        rotateXSlider.addEventListener('input', (e) => {
            rotationX = parseInt(e.target.value, 10);
            rotateXValue.textContent = `${rotationX}°`;
            updateView();
        });

        navLeft.addEventListener('click', () => {
            const pos = availablePages.indexOf(currentIndex);
            if (pos > 0) {
                navigateTo(availablePages[pos - 1], 'prev');
            }
        });

        navRight.addEventListener('click', () => {
            const pos = availablePages.indexOf(currentIndex);
            if (pos < availablePages.length - 1) {
                navigateTo(availablePages[pos + 1], 'next');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !isFullscreen) navLeft.click();
            if (e.key === 'ArrowRight' && !isFullscreen) navRight.click();
            if (e.key === 'Escape' && isFullscreen) toggleFullscreen.click();
        });

        iframe.addEventListener('load', () => {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const style = iframeDoc.createElement('style');
                style.textContent = `
                    html::-webkit-scrollbar, body::-webkit-scrollbar { 
                        display: none !important; 
                        width: 0 !important; 
                        height: 0 !important; 
                    }
                    html, body { 
                        -ms-overflow-style: none !important; 
                        scrollbar-width: none !important; 
                        overflow-y: auto !important;
                        overflow-x: hidden !important;
                        width: 100% !important;
                        max-width: 100% !important;
                        min-height: 100% !important;
                    }
                `;
                iframeDoc.head.appendChild(style);
            } catch (e) {}
        });

        async function init() {
            await checkPages();
            updateView();
        }

        init();
    </script>
</body>
</html>
