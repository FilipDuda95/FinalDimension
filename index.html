<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Prohnutý Monitor (20 Lamel - Perfektní Geometrie)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1918;
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
        }
        .scene:active {
            cursor: grabbing;
        }

        .cylinder {
            position: relative;
            width: 1000px;
            height: 650px;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .segment {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform;
            pointer-events: auto;
        }

        .crop-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .crop-box iframe {
            position: absolute;
            top: 0;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="cylinder" id="cylinder"></div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cylinder = document.getElementById('cylinder');
        
        const totalSegments = 20;
        const totalWidth = 1000;
        const segWidth = totalWidth / totalSegments;

        // Parametry prohnutí (poloměr a úhel)
        const radius = 2200; 
        const totalArcAngle = 20; 
        const angleStep = totalArcAngle / totalSegments;

        const iframes = [];

        // Synchronizace scrollu skrze koordinátor (šetří výkon)
        let isSyncing = false;
        function syncScroll(scrollTop) {
            if (isSyncing) return;
            isSyncing = true;
            
            iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                    iframe.contentWindow.scrollTo(0, scrollTop);
                }
            });

            requestAnimationFrame(() => { isSyncing = false; });
        }

        for (let i = 0; i < totalSegments; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            
            // Šířka prvku s přesným překryvem 0.4px proti vlásečnicovým mezerám
            seg.style.width = `${segWidth + 0.4}px`;
            seg.style.marginLeft = `-${segWidth / 2}px`;

            const centerIndex = (totalSegments - 1) / 2;
            const offsetFromCenter = i - centerIndex;
            
            const segAngle = -offsetFromCenter * angleStep;
            const rad = (segAngle * Math.PI) / 180;

            // Nativní matematické pozicování v 3D
            const xPos = offsetFromCenter * segWidth;
            const zPos = radius - (Math.cos(rad) * radius);

            seg.style.transform = `translateX(${xPos}px) translateZ(${zPos}px) rotateY(${segAngle}deg)`;

            const cropBox = document.createElement('div');
            cropBox.className = 'crop-box';

            const iframe = document.createElement('iframe');
            iframe.src = 'index1.html';
            
            iframe.style.width = `${totalWidth}px`;
            iframe.style.left = `-${i * segWidth}px`;

            iframe.addEventListener('load', () => {
                try {
                    const win = iframe.contentWindow;
                    win.addEventListener('scroll', () => syncScroll(win.scrollY), { passive: true });
                    win.addEventListener('wheel', (e) => syncScroll(win.scrollY + e.deltaY), { passive: true });
                } catch (e) {}
            });

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            // Vizuální stínování okrajových lamel pro 3D efekt
            const shadowIntensity = Math.abs(offsetFromCenter) * 0.012;
            overlay.style.background = `rgba(0,0,0,${shadowIntensity})`;

            cropBox.appendChild(iframe);
            cropBox.appendChild(overlay);
            seg.appendChild(cropBox);
            cylinder.appendChild(seg);

            iframes.push(iframe);
        }

        // Ovládání otáčení monitoru v prostoru
        let isDragging = false;
        let startX = 0, startY = 0;
        let rotX = 8, rotY = 0;

        cylinder.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        scene.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            rotY += dx * 0.25;
            rotX -= dy * 0.25;
            rotX = Math.max(-35, Math.min(35, rotX));

            cylinder.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        // Globální odchytávání kolečka myši
        window.addEventListener('wheel', (e) => {
            if (iframes[0] && iframes[0].contentWindow) {
                syncScroll(iframes[0].contentWindow.scrollY + e.deltaY);
            }
        }, { passive: true });
    </script>
</body>
</html>
