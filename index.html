<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspektivní Prohlížeč — Index Nekonečno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #333333 55%, #000000 100%);
        }

        .scene {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* Mraky před stránkou */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 15;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 100px;
            filter: blur(40px);
        }

        .cloud:nth-child(1) {
            width: 400px;
            height: 140px;
            top: 10%;
            left: -100px;
            animation: drift 22s infinite ease-in-out;
        }

        .cloud:nth-child(2) {
            width: 350px;
            height: 120px;
            top: 40%;
            right: -80px;
            animation: drift 28s infinite ease-in-out reverse;
            animation-delay: 3s;
        }

        .cloud:nth-child(3) {
            width: 300px;
            height: 100px;
            top: 65%;
            left: 15%;
            animation: drift 25s infinite ease-in-out;
            animation-delay: 7s;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(120px) translateY(-20px); }
        }

        /* 3D Kontejner pro okno i obsah */
        .viewport-wrapper {
            position: relative;
            z-index: 5;
            width: 85%;
            height: 80%;
            max-width: 1100px;
            max-height: 800px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        .viewport-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            box-shadow: 0 30px 90px rgba(0,0,0,0.85);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        /* Třídy pro animovaný přechod stránek */
        .slide-out-left {
            transform: translateX(-120%) rotateY(-15deg);
            opacity: 0;
        }

        .slide-out-right {
            transform: translateX(120%) rotateY(15deg);
            opacity: 0;
        }

        .slide-in-left {
            animation: slideInFromLeft 0.35s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-in-right {
            animation: slideInFromRight 0.35s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-120%) rotateY(-15deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0deg); opacity: 1; }
        }

        @keyframes slideInFromRight {
            from { transform: translateX(120%) rotateY(15deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0deg); opacity: 1; }
        }

        /* Přesný iframe bez ořezávání stran + vypnutí scrollbaru */
        .viewport-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            pointer-events: auto;
            scrollbar-width: none; /* Firefox, Chrome/Safari (nové verze) */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .viewport-iframe::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Šipky pro posun stránek */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-size: 32px;
            transition: all 0.2s ease;
            user-select: none;
            z-index: 25;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .nav-arrow:hover {
            background: #ffffff;
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .nav-arrow.left { left: 30px; }
        .nav-arrow.right { right: 30px; }

        /* Ovládací panely vlevo dole */
        .controls-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .zoom-panel {
            width: fit-content;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.18);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
        }

        .control-btn:hover { 
            background: #f0f0f0; 
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .rotate-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 14px;
        }

        .rotate-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rotate-label {
            font-size: 11px;
            color: #333;
            font-weight: 700;
            text-transform: uppercase;
            min-width: 60px;
        }

        .rotate-slider {
            width: 120px;
            cursor: pointer;
        }

        .rotate-value {
            font-size: 12px;
            color: #222;
            font-weight: 600;
            min-width: 36px;
            font-family: monospace;
            text-align: right;
        }

        .page-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 25;
            backdrop-filter: blur(4px);
        }

        /* Responsivní úpravy pro mobilní zařízení */
        @media (max-width: 768px) {
            .viewport-wrapper {
                width: 92%;
                height: 75%;
            }
            .nav-arrow {
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            .nav-arrow.left { left: 10px; }
            .nav-arrow.right { right: 10px; }
            .controls-container {
                bottom: 15px;
                left: 15px;
                scale: 0.9;
                transform-origin: bottom left;
            }
        }
    </style>
</head>
<body>

    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div class="scene">
        <div class="viewport-wrapper" id="viewportWrapper">
            <div class="viewport-frame" id="viewportFrame">
                <iframe 
                    class="viewport-iframe" 
                    id="contentIframe"
                    src="index1.html"
                ></iframe>
            </div>
        </div>

        <div class="nav-arrow left" id="navLeft">‹</div>
        <div class="nav-arrow right" id="navRight">›</div>

        <div class="controls-container">
            <div class="panel-box zoom-panel">
                <button class="control-btn" id="zoomIn" title="Přiblížit">+</button>
                <button class="control-btn" id="zoomOut" title="Oddálit">−</button>
            </div>

            <div class="panel-box rotate-panel">
                <div class="rotate-row">
                    <span class="rotate-label">Rotace Y</span>
                    <input type="range" class="rotate-slider" id="rotateYSlider" min="-45" max="45" value="0">
                    <span class="rotate-value" id="rotateYValue">0°</span>
                </div>
                <div class="rotate-row">
                    <span class="rotate-label">Rotace X</span>
                    <input type="range" class="rotate-slider" id="rotateXSlider" min="-45" max="45" value="12">
                    <span class="rotate-value" id="rotateXValue">12°</span>
                </div>
            </div>
        </div>

        <div class="page-indicator" id="pageIndicator">index1.html</div>
    </div>

    <script>
        const viewportWrapper = document.getElementById('viewportWrapper');
        const viewportFrame = document.getElementById('viewportFrame');
        const iframe = document.getElementById('contentIframe');
        const pageIndicator = document.getElementById('pageIndicator');
        
        const rotateYSlider = document.getElementById('rotateYSlider');
        const rotateYValue = document.getElementById('rotateYValue');
        const rotateXSlider = document.getElementById('rotateXSlider');
        const rotateXValue = document.getElementById('rotateXValue');
        
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const navLeft = document.getElementById('navLeft');
        const navRight = document.getElementById('navRight');

        let currentIndex = 1;
        let zoomLevel = 1;
        let rotationY = 0;
        let rotationX = 12;
        let availablePages = [];
        let isAnimating = false;

        async function checkPages() {
            availablePages = [];
            let i = 1;
            
            while (i <= 100) {
                const filename = `index${i}.html`;
                try {
                    const res = await fetch(filename, { method: 'HEAD' });
                    if (res.ok) {
                        availablePages.push(i);
                        i++;
                    } else {
                        break;
                    }
                } catch (e) {
                    break;
                }
            }

            if (availablePages.length === 0) {
                availablePages = [1, 2, 3];
            }

            updateNavButtons();
        }

        function updateNavButtons() {
            const pos = availablePages.indexOf(currentIndex);
            
            if (pos <= 0) {
                navLeft.classList.add('disabled');
            } else {
                navLeft.classList.remove('disabled');
            }

            if (pos >= availablePages.length - 1) {
                navRight.classList.add('disabled');
            } else {
                navRight.classList.remove('disabled');
            }
        }

        function updateView() {
            viewportWrapper.style.transform = `
                rotateX(${rotationX}deg) 
                rotateY(${rotationY}deg) 
                scale(${zoomLevel})
            `;
        }

        function navigateTo(targetIndex, direction) {
            if (isAnimating || targetIndex === currentIndex) return;
            isAnimating = true;

            const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
            const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

            viewportFrame.className = `viewport-frame ${outClass}`;

            setTimeout(() => {
                currentIndex = targetIndex;
                iframe.src = `index${currentIndex}.html`;
                pageIndicator.textContent = `index${currentIndex}.html`;
                updateNavButtons();

                viewportFrame.className = `viewport-frame ${inClass}`;

                setTimeout(() => {
                    viewportFrame.className = 'viewport-frame';
                    isAnimating = false;
                }, 350);
            }, 350);
        }

        zoomIn.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 0.1, 1.8);
            updateView();
        });

        zoomOut.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            updateView();
        });

        rotateYSlider.addEventListener('input', (e) => {
            rotationY = parseInt(e.target.value, 10);
            rotateYValue.textContent = `${rotationY}°`;
            updateView();
        });

        rotateXSlider.addEventListener('input', (e) => {
            rotationX = parseInt(e.target.value, 10);
            rotateXValue.textContent = `${rotationX}°`;
            updateView();
        });

        navLeft.addEventListener('click', () => {
            const pos = availablePages.indexOf(currentIndex);
            if (pos > 0) {
                navigateTo(availablePages[pos - 1], 'prev');
            }
        });

        navRight.addEventListener('click', () => {
            const pos = availablePages.indexOf(currentIndex);
            if (pos < availablePages.length - 1) {
                navigateTo(availablePages[pos + 1], 'next');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') navLeft.click();
            if (e.key === 'ArrowRight') navRight.click();
        });

        /* Bezpečné vložení CSS pravidel přímo do dokumentu uvnitř iframe */
        iframe.addEventListener('load', () => {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const style = iframeDoc.createElement('style');
                style.textContent = `
                    html::-webkit-scrollbar, body::-webkit-scrollbar { 
                        display: none !important; 
                        width: 0 !important; 
                        height: 0 !important; 
                    }
                    html, body { 
                        -ms-overflow-style: none !important; 
                        scrollbar-width: none !important; 
                        overflow-y: auto !important;
                    }
                `;
                iframeDoc.head.appendChild(style);
            } catch (e) {}
        });

        async function init() {
            await checkPages();
            updateView();
        }

        init();
    </script>
</body>
</html>
