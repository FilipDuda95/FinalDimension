<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Prohnutý Monitor (Canvas Stream do 20 Lamel)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1918;
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
        }
        .scene:active {
            cursor: grabbing;
        }

        .cylinder {
            position: relative;
            width: 1000px;
            height: 650px;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .segment {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform;
            pointer-events: auto;
        }

        .crop-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .crop-box iframe, 
        .crop-box canvas {
            position: absolute;
            top: 0;
            height: 100%;
            border: none;
        }

        .crop-box iframe {
            pointer-events: auto;
        }

        .crop-box canvas {
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="cylinder" id="cylinder"></div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cylinder = document.getElementById('cylinder');
        
        const totalSegments = 20;
        const totalWidth = 1000;
        const segWidth = totalWidth / totalSegments;

        // Parametry prohnutí (radius a úhel směrem k uživateli)
        const radius = 2200; 
        const totalArcAngle = 20; 
        const angleStep = totalArcAngle / totalSegments;

        let masterIframe = null;
        const slaveCanvases = [];

        for (let i = 0; i < totalSegments; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            
            seg.style.width = `${segWidth + 0.4}px`;
            seg.style.marginLeft = `-${segWidth / 2}px`;

            const centerIndex = (totalSegments - 1) / 2;
            const offsetFromCenter = i - centerIndex;
            
            const segAngle = -offsetFromCenter * angleStep;
            const rad = (segAngle * Math.PI) / 180;

            // Matematické prohnutí lamel směrem dovnitř
            const xPos = offsetFromCenter * segWidth;
            const zPos = radius - (Math.cos(rad) * radius);

            seg.style.transform = `translateX(${xPos}px) translateZ(${zPos}px) rotateY(${segAngle}deg)`;

            const cropBox = document.createElement('div');
            cropBox.className = 'crop-box';

            // 1. Lamela obsahuje reálný master iframe, ostatní 19 lamel mají pouze Canvas
            if (i === 0) {
                masterIframe = document.createElement('iframe');
                masterIframe.src = 'index1.html';
                masterIframe.style.width = `${totalWidth}px`;
                masterIframe.style.left = `0px`;
                cropBox.appendChild(masterIframe);
            } else {
                const canvas = document.createElement('canvas');
                canvas.width = segWidth;
                canvas.height = 650;
                canvas.style.width = `${segWidth}px`;
                canvas.style.left = `0px`;
                
                // Uložíme výřezový offset pro danou lamelu
                canvas.dataset.offsetX = i * segWidth;
                
                cropBox.appendChild(canvas);
                slaveCanvases.push(canvas);
            }

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            const shadowIntensity = Math.abs(offsetFromCenter) * 0.012;
            overlay.style.background = `rgba(0,0,0,${shadowIntensity})`;

            cropBox.appendChild(overlay);
            seg.appendChild(cropBox);
            cylinder.appendChild(seg);
        }

        // Vykreslovací smyčka pro přenos obrazu z 1 master iframe do 19 lamel
        function renderLoop() {
            if (masterIframe && masterIframe.contentDocument) {
                try {
                    slaveCanvases.forEach(canvas => {
                        const ctx = canvas.getContext('2d');
                        const offsetX = parseFloat(canvas.dataset.offsetX);
                        
                        // Kreslení odpovídajícího výřezu z prvního iframe
                        ctx.drawImage(
                            masterIframe.contentWindow.document.body, 
                            offsetX, 0, segWidth, 650, 
                            0, 0, segWidth, 650
                        );
                    });
                } catch (e) {
                    // Ošetření CORS omezení při lokálním testování
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // Spuštění streamování po načtení podkladu
        if (masterIframe) {
            masterIframe.addEventListener('load', () => {
                renderLoop();
            });
        }

        // Ovládání otáčení monitoru v prostoru
        let isDragging = false;
        let startX = 0, startY = 0;
        let rotX = 8, rotY = 0;

        cylinder.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        scene.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            rotY += dx * 0.25;
            rotX -= dy * 0.25;
            rotX = Math.max(-35, Math.min(35, rotX));

            cylinder.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
    </script>
</body>
</html>
