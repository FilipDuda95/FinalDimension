<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filip Duda - 2D/3D grafický design a herní vývoj.</title>
    
    <!-- Open Graph / Sociální karta -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://filipduda95.github.io/final_dimension/">
    <meta property="og:title" content="Final Dimension — Filip Duda">
    <meta property="og:description" content="2D/3D grafický design a herní vývoj.">
    <meta property="og:image" content="https://filipduda95.github.io/final_dimension/style/Logo.jpg">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    
    <style>
/* Skryje scrollbar pro WebKit (Chrome, Safari, Edge) */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* Skryje scrollbar pro Firefox a IE/Edge */
html, body {
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE a starý Edge */
    -webkit-overflow-scrolling: touch; /* Hladký posun na iOS */
    background-color: #000000; /* Černé pozadí pro sociální kartu a stránku */
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #333333 55%, #000000 100%);
            touch-action: manipulation;
        }

        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: hidden;
        }

        /* Mraky před stránkou */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 15;
            transition: opacity 0.3s ease;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 100px;
            filter: blur(40px);
        }

        .cloud:nth-child(1) {
            width: 400px;
            height: 140px;
            top: 10%;
            left: -100px;
            animation: drift 22s infinite ease-in-out;
        }

        .cloud:nth-child(2) {
            width: 350px;
            height: 120px;
            top: 40%;
            right: -80px;
            animation: drift 28s infinite ease-in-out reverse;
            animation-delay: 3s;
        }

        .cloud:nth-child(3) {
            width: 300px;
            height: 100px;
            top: 65%;
            left: 15%;
            animation: drift 25s infinite ease-in-out;
            animation-delay: 7s;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(120px) translateY(-20px); }
        }

        /* 3D Kontejner pro okno i obsah */
        .viewport-wrapper {
            position: relative;
            z-index: 5;
            width: 85%;
            height: 80%;
            max-width: 1200px;
            max-height: 95vh;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease, max-width 0.3s ease, max-height 0.3s ease;
        }

        /* Režim celé obrazovky pro iframe kontejner */
        .viewport-wrapper.fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            transform: none !important;
            z-index: 30;
            margin-top: 0 !important;
        }

        .viewport-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            box-shadow: 0 30px 90px rgba(0,0,0,0.85);
            border-radius: 6px;
            overflow: hidden;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform: translateZ(0);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, border-radius 0.3s ease;
            transform-style: preserve-3d;
        }

        .viewport-frame.is-dual-screen {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            outline: none !important;
            overflow: visible !important;
        }
        .viewport-wrapper.fullscreen .viewport-frame {
            border-radius: 0;
            box-shadow: none;
        }

        .viewport-wrapper.fullscreen.is-dual-fullscreen .pc-monitor {
            display: none !important;
        }

        .viewport-wrapper.fullscreen.is-dual-fullscreen .phone-portrait {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            transform: none !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            z-index: 35 !important;
        }

        .viewport-wrapper.fullscreen.is-dual-fullscreen .phone-portrait .viewport-iframe {
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
            background-color: black;
        }

        .page-slot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .page-slot.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
        }

        .resize-handle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            cursor: ns-resize;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, opacity 0.3s, box-shadow 0.2s;
            user-select: none;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .resize-handle:hover, .resize-handle.active {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .resize-handle::after {
            content: '';
            width: 30px;
            height: 3px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 2px;
        }

        .resize-handle.top { top: -10px; }
        .resize-handle.bottom { bottom: -10px; }

        body.is-fullscreen .resize-handle {
            display: none !important;
        }

        .slide-out-left {
            transform: translate3d(-120%, 0, 0) rotateY(-15deg);
            opacity: 0;
        }

        .slide-out-right {
            transform: translate3d(120%, 0, 0) rotateY(15deg);
            opacity: 0;
        }

        .slide-in-left {
            animation: slideInFromLeft 0.35s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-in-right {
            animation: slideInFromRight 0.35s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInFromLeft {
            from { transform: translate3d(-120%, 0, 0) rotateY(-15deg); opacity: 0; }
            to { transform: translate3d(0, 0, 0) rotateY(0deg); opacity: 1; }
        }

        @keyframes slideInFromRight {
            from { transform: translate3d(120%, 0, 0) rotateY(15deg); opacity: 0; }
            to { transform: translate3d(0, 0, 0) rotateY(0deg); opacity: 1; }
        }

        .viewport-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            pointer-events: auto;
            scrollbar-width: none;
            border-radius: inherit;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }

        .viewport-iframe::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .dual-screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            background: transparent;
        }

        .device-frame {
            position: absolute;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 35px 75px rgba(0,0,0,0.75);
            background: #111;
            border: 5px solid #1a1a1a;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .device-frame.pc-monitor {
            width: 58%;
            height: 70%;
            max-width: 620px;
            max-height: 400px;
            transform: translateZ(20px) translateX(-85px) rotateY(8deg);
            z-index: 4;
            display: flex;
            flex-direction: column;
        }

        .pc-screen-area {
            position: relative;
            width: 100%;
            height: calc(100% - 18px);
            background: #fff;
            overflow: hidden;
        }

        .device-frame.pc-monitor .viewport-iframe {
            width: 133.3%;
            height: 133.3%;
            transform: scale(0.75);
            transform-origin: top left;
        }

        .pc-chin {
            width: 100%;
            height: 18px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pc-led {
            width: 4px;
            height: 4px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ffcc;
        }

        .device-frame.phone-portrait {
            width: 230px;
            height: 460px;
            max-width: 230px;
            max-height: 460px;
            transform: translateZ(90px) translateX(85px) rotateY(-6deg) rotateX(2deg);
            border-width: 7px;
            border-radius: 28px;
            z-index: 10;
        }

        .device-frame.phone-portrait .viewport-iframe {
            width: 153.8%;
            height: 153.8%;
            transform: scale(0.65);
            transform-origin: top left;
        }

        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            transition: all 0.2s ease;
            user-select: none;
            z-index: 25;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }

        .nav-arrow:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
            color: #ffffff;
        }

        .nav-arrow.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        .nav-arrow.left { left: 30px; }
        .nav-arrow.right { right: 30px; }

        .controls-container {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            z-index: 40;
            background: rgba(18, 18, 18, 0.85);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            height: 40px;
            max-width: calc(100vw - 20px);
            transition: left 0.3s ease, transform 0.3s ease, bottom 0.3s ease, height 0.3s ease, padding 0.3s ease, gap 0.3s ease;
        }

        .panel-box {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 100%;
        }

        .control-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 14px;
            font-weight: bold;
            user-select: none;
            transition: background 0.2s, transform 0.1s, color 0.2s, width 0.3s ease, height 0.3s ease, min-width 0.3s ease, font-size 0.3s ease;
            flex-shrink: 0;
        }

        .control-btn:hover { 
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .rotate-panel {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
            height: 100%;
        }

        .rotate-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rotate-label {
            font-size: 10px;
            color: #aaa;
            font-weight: 700;
            text-transform: uppercase;
        }

        .rotate-slider {
            width: 50px;
            cursor: pointer;
            accent-color: #888888;
        }

        .rotate-value {
            font-size: 10px;
            color: #fff;
            font-weight: 600;
            min-width: 22px;
            font-family: monospace;
            text-align: right;
        }

        body.is-fullscreen .nav-arrow,
        body.is-fullscreen .zoom-panel,
        body.is-fullscreen .rotate-panel,
        body.is-fullscreen .clouds {
            display: none !important;
        }

        body.is-fullscreen .controls-container {
            left: 44px !important;
            bottom: 24px !important;
            transform: none !important;
            height: 52px !important;
            padding: 6px !important;
            gap: 8px !important;
            z-index: 40 !important;
        }

        body.is-fullscreen .control-btn {
            width: 40px !important;
            height: 40px !important;
            min-width: 40px !important;
            font-size: 18px !important;
        }

        body.is-fullscreen .control-btn svg {
            width: 18px !important;
            height: 18px !important;
        }

        @media (max-width: 768px) and (pointer: coarse) {
            .viewport-wrapper {
                width: 92vw;
                height: 74vh;
                margin-top: -25px;
            }

            .device-frame.pc-monitor {
                width: 82% !important;
                max-width: none !important;
                height: 55% !important;
                transform: translateZ(10px) translateX(-15px) rotateY(4deg) !important;
            }

            .device-frame.phone-portrait {
                width: 140px !important;
                height: 280px !important;
                max-width: 140px !important;
                max-height: 280px !important;
                border-width: 5px !important;
                border-radius: 20px !important;
                transform: translateZ(70px) translateX(65px) rotateY(-4deg) rotateX(1deg) !important;
            }

            .device-frame.phone-portrait .viewport-iframe {
                width: 181.8% !important;
                height: 181.8% !important;
                transform: scale(0.55) !important;
                transform-origin: top left;
            }

            .nav-arrow {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
            .nav-arrow.left { left: 8px; }
            .nav-arrow.right { right: 8px; }

            .controls-container {
                bottom: 6px;
                gap: 4px;
                padding: 3px;
                height: 36px;
                max-width: calc(100vw - 16px);
            }

            body.is-fullscreen .controls-container {
                left: 34px !important;
                bottom: 20px !important;
                height: 46px !important;
                padding: 4px !important;
            }

            .control-btn {
                width: 28px;
                height: 28px;
                min-width: 28px;
                font-size: 13px;
            }

            .control-btn svg {
                width: 13px;
                height: 13px;
            }

            body.is-fullscreen .control-btn {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
                font-size: 16px !important;
            }

            body.is-fullscreen .control-btn svg {
                width: 16px !important;
                height: 16px !important;
            }

            .rotate-panel {
                gap: 4px;
                padding: 0 2px;
            }

            .rotate-slider {
                width: 35px;
            }

            .rotate-value {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div class="scene">
        <div class="viewport-wrapper" id="viewportWrapper">
            <div class="resize-handle top" id="resizeTop"></div>
            <div class="resize-handle bottom" id="resizeBottom"></div>

            <div class="viewport-frame" id="viewportFrame">
                <!-- Sloty se vytvoří dynamicky -->
            </div>
        </div>

        <div class="nav-arrow left" id="navLeft">‹</div>
        <div class="nav-arrow right" id="navRight">›</div>

        <div class="controls-container">
            <div class="panel-box zoom-panel">
                <button class="control-btn" id="resetRotation" title="Obnovit původní zobrazení">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
                <button class="control-btn" id="zoomIn" title="Přiblížit">+</button>
                <button class="control-btn" id="zoomOut" title="Oddálit">−</button>
            </div>

            <div class="panel-box rotate-panel">
                <div class="rotate-row">
                    <span class="rotate-label">Y</span>
                    <input type="range" class="rotate-slider" id="rotateYSlider" min="-45" max="45" value="0">
                    <span class="rotate-value" id="rotateYValue">0°</span>
                </div>
                <div class="rotate-row">
                    <span class="rotate-label">X</span>
                    <input type="range" class="rotate-slider" id="rotateXSlider" min="-45" max="45" value="12">
                    <span class="rotate-value" id="rotateXValue">12°</span>
                </div>
            </div>

            <div class="panel-box">
                <button class="control-btn" id="toggleFullscreen" title="Zvětšit na celou obrazovku">
                    <svg id="searchIcon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const availablePages = [
            "index1.html",
            "dual-screen", 
            "index3.html"
        ];

        const viewportWrapper = document.getElementById('viewportWrapper');
        const viewportFrame = document.getElementById('viewportFrame');
        
        const rotateYSlider = document.getElementById('rotateYSlider');
        const rotateYValue = document.getElementById('rotateYValue');
        const rotateXSlider = document.getElementById('rotateXSlider');
        const rotateXValue = document.getElementById('rotateXValue');
        
        const resetRotation = document.getElementById('resetRotation');
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const navLeft = document.getElementById('navLeft');
        const navRight = document.getElementById('navRight');
        const toggleFullscreen = document.getElementById('toggleFullscreen');
        const searchIcon = document.getElementById('searchIcon');

        const resizeTop = document.getElementById('resizeTop');
        const resizeBottom = document.getElementById('resizeBottom');

        const isMobile = window.innerWidth <= 768 && window.matchMedia('(pointer: coarse)').matches;

        const DEFAULT_ZOOM = 1;
        const DEFAULT_ROTATION_Y = isMobile ? 12 : 0;
        const DEFAULT_ROTATION_X = isMobile ? 0 : 12;

        let currentFileIndex = 0;
        let zoomLevel = DEFAULT_ZOOM;
        let rotationY = DEFAULT_ROTATION_Y;
        let rotationX = DEFAULT_ROTATION_X;
        let isAnimating = false;
        let isFullscreen = false;

        let historyStack = [0]; 
        let historyPointer = 0;

        rotateXSlider.value = rotationX;
        rotateXValue.textContent = `${rotationX}°`;

        rotateYSlider.value = rotationY;
        rotateYValue.textContent = `${rotationY}°`;

        let isResizing = false;
        let startY = 0;
        let startHeight = 0;
        let activeTarget = null;
        let handleType = '';

        function getActiveIframes() {
            return viewportFrame.querySelectorAll('.page-slot.active iframe');
        }

        function updatePhoneScale() {
            const phoneElement = viewportFrame.querySelector('.page-slot.active .phone-portrait');
            if (!phoneElement) return;

            const currentH = viewportWrapper.offsetHeight;
            const baseH = 800;
            let scaleFactor = currentH / baseH;
            scaleFactor = Math.min(Math.max(scaleFactor, 0.45), 1.7);

            if (window.innerWidth <= 768 && window.matchMedia('(pointer: coarse)').matches) {
                phoneElement.style.transform = `translateZ(70px) translateX(65px) rotateY(-4deg) rotateX(1deg) scale(${scaleFactor})`;
            } else {
                phoneElement.style.transform = `translateZ(90px) translateX(85px) rotateY(-6deg) rotateX(2deg) scale(${scaleFactor})`;
            }
        }

        function onPointerDown(e, type) {
            if (isFullscreen) return;
            isResizing = true;
            handleType = type;
            activeTarget = e.currentTarget;
            
            activeTarget.setPointerCapture(e.pointerId);
            
            startY = e.clientY;
            startHeight = viewportWrapper.offsetHeight;

            getActiveIframes().forEach(iframe => iframe.style.pointerEvents = 'none');
            viewportWrapper.style.transition = 'none';
            document.body.style.cursor = 'ns-resize';
            
            activeTarget.classList.add('active');
        }

        function onPointerMove(e) {
            if (!isResizing) return;

            const deltaY = e.clientY - startY;
            let newHeight = handleType === 'bottom' 
                ? startHeight + (deltaY * 2) 
                : startHeight - (deltaY * 2);

            const minHeight = 320;
            const maxHeight = window.innerHeight * 0.98;

            if (newHeight >= minHeight && newHeight <= maxHeight) {
                viewportWrapper.style.height = `${newHeight}px`;
                viewportWrapper.style.maxHeight = 'none';
                updatePhoneScale();
            }
        }

        function onPointerUp(e) {
            if (!isResizing) return;
            isResizing = false;

            if (activeTarget) {
                try {
                    activeTarget.releasePointerCapture(e.pointerId);
                } catch (err) {}
                activeTarget.classList.remove('active');
            }

            getActiveIframes().forEach(iframe => iframe.style.pointerEvents = 'auto');
            viewportWrapper.style.transition = 'transform 0.3s ease-out, width 0.3s ease, height 0.3s ease, max-width 0.3s ease, max-height 0.3s ease';
            document.body.style.cursor = '';
            activeTarget = null;
        }

        resizeTop.addEventListener('pointerdown', (e) => onPointerDown(e, 'top'));
        resizeTop.addEventListener('pointermove', onPointerMove);
        resizeTop.addEventListener('pointerup', onPointerUp);
        resizeTop.addEventListener('pointercancel', onPointerUp);

        resizeBottom.addEventListener('pointerdown', (e) => onPointerDown(e, 'bottom'));
        resizeBottom.addEventListener('pointermove', onPointerMove);
        resizeBottom.addEventListener('pointerup', onPointerUp);
        resizeBottom.addEventListener('pointercancel', onPointerUp);

        function updateNavButtons() {
            if (currentFileIndex <= 0) {
                navLeft.classList.add('disabled');
            } else {
                navLeft.classList.remove('disabled');
            }

            if (currentFileIndex >= availablePages.length - 1) {
                navRight.classList.add('disabled');
            } else {
                navRight.classList.remove('disabled');
            }
        }

        function updateView() {
            if (isFullscreen) return;
            viewportWrapper.style.transform = `
                rotateX(${rotationX}deg) 
                rotateY(${rotationY}deg) 
                scale(${zoomLevel})
            `;
        }

        // Generování HTML obsahu pro konkrétní slot
        function getSlotHTML(pageConfig, loadImmediately = false) {
            if (pageConfig === "dual-screen") {
                const srcPC = loadImmediately ? 'index3.html' : '';
                const srcPhone = loadImmediately ? 'index2.html' : '';
                return `
                    <div class="dual-screen-container">
                        <div class="device-frame pc-monitor">
                            <div class="pc-screen-area">
                                <iframe class="viewport-iframe" data-src="index3.html" ${loadImmediately ? `src="${srcPC}"` : ''}></iframe>
                            </div>
                            <div class="pc-chin"><div class="pc-led"></div></div>
                        </div>
                        <div class="device-frame phone-portrait">
                            <iframe class="viewport-iframe" data-src="index2.html" ${loadImmediately ? `src="${srcPhone}"` : ''}></iframe>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <iframe class="viewport-iframe" data-src="${pageConfig}" ${loadImmediately ? `src="${pageConfig}"` : ''}></iframe>
                `;
            }
        }

        // Načte iframy v daném slotu a skryje v nich scrollbar
        function activateSlotContent(slot) {
            const iframes = slot.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (!iframe.getAttribute('src') && iframe.dataset.src) {
                    iframe.src = iframe.dataset.src;
                    iframe.removeEventListener('load', hideIframeScrollbar);
                    iframe.addEventListener('load', hideIframeScrollbar);
                }
            });
        }

        // Zastaví/vymaže iframy v neaktivním slotu pro úsporu paměti a CPU
        function deactivateSlotContent(slot) {
            const iframes = slot.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.removeAttribute('src');
            });
        }

        // Inicializace slotů
        function initAllPages() {
            availablePages.forEach((pageConfig, index) => {
                const slot = document.createElement('div');
                slot.className = `page-slot ${index === currentFileIndex ? 'active' : ''}`;
                slot.dataset.index = index;

                const shouldLoad = (index === currentFileIndex);
                slot.innerHTML = getSlotHTML(pageConfig, shouldLoad);

                viewportFrame.appendChild(slot);
            });

            // Připojení listeneru pro úvodní iframe(y)
            viewportFrame.querySelectorAll('.page-slot.active iframe').forEach(iframe => {
                if (iframe.getAttribute('src')) {
                    iframe.addEventListener('load', hideIframeScrollbar);
                }
            });

            updatePhoneScale();
        }

        function navigateTo(targetIndex, direction, isPopState = false) {
            if (isAnimating || targetIndex === currentFileIndex || !availablePages[targetIndex]) return;
            isAnimating = true;

            if (!isPopState) {
                historyStack = historyStack.slice(0, historyPointer + 1);
                historyStack.push(targetIndex);
                if (historyStack.length > 3) {
                    historyStack.shift();
                }
                historyPointer = historyStack.length - 1;
                window.history.replaceState({ index: targetIndex }, '');
            }

            const slots = viewportFrame.querySelectorAll('.page-slot');
            const targetSlot = Array.from(slots).find(s => parseInt(s.dataset.index) === targetIndex);
            
            // Aktivace (načtení) nového slotu
            if (targetSlot) {
                activateSlotContent(targetSlot);
            }

            const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
            const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

            const isDualNow = availablePages[currentFileIndex] === "dual-screen";
            if (isDualNow) {
                viewportFrame.classList.add('is-dual-screen');
            } else {
                viewportFrame.classList.remove('is-dual-screen');
            }
            
            viewportFrame.classList.add(outClass);

            setTimeout(() => {
                slots.forEach(slot => {
                    const slotIndex = parseInt(slot.dataset.index);
                    if (slotIndex === targetIndex) {
                        slot.classList.add('active');
                    } else {
                        slot.classList.remove('active');
                        // Zde se okno kompletně stopne/vymaže, aby neběželo na pozadí
                        deactivateSlotContent(slot);
                    }
                });

                currentFileIndex = targetIndex;
                updateNavButtons();

                const isDualNext = availablePages[currentFileIndex] === "dual-screen";
                if (isDualNext) {
                    viewportFrame.classList.add('is-dual-screen');
                } else {
                    viewportFrame.classList.remove('is-dual-screen');
                }

                updatePhoneScale();

                viewportFrame.classList.remove(outClass);
                viewportFrame.classList.add(inClass);

                setTimeout(() => {
                    viewportFrame.classList.remove(inClass);
                    isAnimating = false;
                }, 350);
            }, 350);
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && typeof e.state.index === 'number') {
                const target = e.state.index;
                const direction = target > currentFileIndex ? 'next' : 'prev';
                navigateTo(target, direction, true);
            }
        });

        toggleFullscreen.addEventListener('click', () => {
            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                document.body.classList.add('is-fullscreen');
                viewportWrapper.classList.add('fullscreen');
                if (availablePages[currentFileIndex] === "dual-screen") {
                    viewportWrapper.classList.add('is-dual-fullscreen');
                }
                searchIcon.innerHTML = `
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                `;
                toggleFullscreen.title = 'Zmenšit zpět';
            } else {
                document.body.classList.remove('is-fullscreen');
                viewportWrapper.classList.remove('fullscreen');
                viewportWrapper.classList.remove('is-dual-fullscreen');
                searchIcon.innerHTML = `
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                `;
                toggleFullscreen.title = 'Zvětšit na celou obrazovku';
                updateView();
            }
        });

        resetRotation.addEventListener('click', () => {
            zoomLevel = DEFAULT_ZOOM;
            rotationX = DEFAULT_ROTATION_X;
            rotationY = DEFAULT_ROTATION_Y;

            rotateXSlider.value = rotationX;
            rotateYSlider.value = rotationY;
            rotateXValue.textContent = `${rotationX}°`;
            rotateYValue.textContent = `${rotationY}°`;

            viewportWrapper.style.height = '';
            viewportWrapper.style.maxHeight = '';
            updatePhoneScale();

            updateView();
        });

        zoomIn.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 0.1, 1.8);
            updateView();
        });

        zoomOut.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            updateView();
        });

        rotateYSlider.addEventListener('input', (e) => {
            rotationY = parseInt(e.target.value, 10);
            rotateYValue.textContent = `${rotationY}°`;
            updateView();
        });

        rotateXSlider.addEventListener('input', (e) => {
            rotationX = parseInt(e.target.value, 10);
            rotateXValue.textContent = `${rotationX}°`;
            updateView();
        });

        navLeft.addEventListener('click', () => {
            if (currentFileIndex > 0) {
                navigateTo(currentFileIndex - 1, 'prev');
            }
        });

        navRight.addEventListener('click', () => {
            if (currentFileIndex < availablePages.length - 1) {
                navigateTo(currentFileIndex + 1, 'next');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !isFullscreen) navLeft.click();
            if (e.key === 'ArrowRight' && !isFullscreen) navRight.click();
            if (e.key === 'Escape' && isFullscreen) toggleFullscreen.click();
        });

        function init() {
            window.history.replaceState({ index: 0 }, '');
            initAllPages();
            if (availablePages[0] === "dual-screen") {
                viewportFrame.classList.add('is-dual-screen');
            }
            updateNavButtons();
            updateView();
        }

        function hideIframeScrollbar(e) {
            try {
                const targetIframe = e ? e.target : this;
                const iframeDoc = targetIframe.contentDocument || targetIframe.contentWindow.document;
                if (!iframeDoc) return;

                const style = iframeDoc.createElement('style');
                style.textContent = `
                    html::-webkit-scrollbar, body::-webkit-scrollbar {
                        display: none !important;
                        width: 0 !important;
                        height: 0 !important;
                    }
                    html, body {
                        scrollbar-width: none !important;
                        -ms-overflow-style: none !important;
                    }
                `;
                iframeDoc.head.appendChild(style);
            } catch (err) {
                console.warn("Nelze upravit styl iframe kvůli Same-Origin policy:", err);
            }
        }

        init();
    </script>
</body>
</html>
