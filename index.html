<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skutečně 3D Prohnutý Monitor (WebGL Shader)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1918;
        }

        /* Skrytý zdrojový iframe - načte se pouze 1x */
        #source-container {
            position: absolute;
            width: 1280px;
            height: 720px;
            left: -9999px;
            top: -9999px;
        }

        #source-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }
    </style>
    <!-- Načtení Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="source-container">
        <iframe id="source-iframe" src="index1.html"></iframe>
    </div>

    <div id="webgl-container"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const iframe = document.getElementById('source-iframe');

        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. Vytvoření dynamické 2D plátna (Canvas Texture)
        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        // 3. Custom Shader pro SKUTEČNÉ CYLINDRICKÉ PROHNUTÍ 20 LAMEL
        const curvedMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTexture: { value: texture },
                uSegments: { value: 20.0 },
                uRadius: { value: 2.5 }, // Poloměr zakřivení
                uCurvature: { value: 0.4 } // Síla prohnutí
            },
            vertexShader: `
                uniform float uSegments;
                uniform float uRadius;
                uniform float uCurvature;
                varying vec2 vUv;
                varying float vSlatEdge;

                void main() {
                    vUv = uv;

                    vec3 pos = position;
                    
                    // Matematické zakřivení osy Z (OHYB DO OBLOUKU)
                    float angle = pos.x * uCurvature;
                    pos.z += (1.0 - cos(angle)) * uRadius;
                    pos.x = sin(angle) * uRadius;

                    // Výpočet hrany pro efekt 20 lamel
                    float segmentGrid = fract(uv.x * uSegments);
                    vSlatEdge = smoothstep(0.0, 0.05, segmentGrid) * smoothstep(1.0, 0.95, segmentGrid);

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture;
                varying vec2 vUv;
                varying float vSlatEdge;

                void main() {
                    vec4 color = texture2D(uTexture, vUv);
                    
                    // Jemné stínování lamelových spár
                    float shadow = mix(0.75, 1.0, vSlatEdge);
                    gl_FragColor = vec4(color.rgb * shadow, color.a);
                }
            `,
            side: THREE.DoubleSide,
            transparent: true
        });

        // Geometry (hustá mřížka, aby se ohyb nesekal)
        const geometry = new THREE.PlaneGeometry(4, 2.25, 80, 1);
        const mesh = new THREE.Mesh(geometry, curvedMaterial);
        mesh.rotation.x = 0.15;
        scene.add(mesh);

        // 4. Překreslování skrytého iframe do 3D textury přes SVG Image
        function updateTextureFromIframe() {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc || !doc.body) return;

                const htmlString = new XMLSerializer().serializeToString(doc);
                const svgString = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
                        <foreignObject width="100%" height="100%">
                            <div xmlns="http://www.w3.org/1999/xhtml">
                                ${htmlString}
                            </div>
                        </foreignObject>
                    </svg>
                `;

                const img = new Image();
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);

                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    texture.needsUpdate = true;
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            } catch (e) {}
        }

        iframe.addEventListener('load', () => {
            updateTextureFromIframe();
            setInterval(updateTextureFromIframe, 150);
        });

        // 5. Otáčení a Scroll
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - prevMouse.x;
            const dy = e.clientY - prevMouse.y;

            mesh.rotation.y += dx * 0.005;
            mesh.rotation.x += dy * 0.003;

            prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        window.addEventListener('wheel', (e) => {
            if (iframe.contentWindow) {
                iframe.contentWindow.scrollBy(0, e.deltaY);
                setTimeout(updateTextureFromIframe, 40);
            }
        }, { passive: true });

        // Render smyčka
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
