<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Had s přechody a ovládáním</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Vinetace / jemný přechod do černé po stranách */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 80px 30px rgba(0, 0, 0, 0.8),
                        inset 0 0 150px 60px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            z-index: 20;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Dotyková / myší ovládaná tlačítka */
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 65px);
            gap: 10px;
            z-index: 25;
            touch-action: manipulation;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            z-index: 30;
            display: none;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        #game-over button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 20px;
            background: #ff3333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #game-over button:hover {
            background: #ff5555;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    
    <div id="ui">
        Skóre: <span id="score">0</span> | Délka hada: <span id="length">3</span>
    </div>

    <!-- On-screen tlačítka pro iframe a mobily -->
    <div id="controls">
        <button class="ctrl-btn" id="btn-up" onclick="changeDir(0, -1)">▲</button>
        <button class="ctrl-btn" id="btn-left" onclick="changeDir(-1, 0)">◀</button>
        <button class="ctrl-btn" id="btn-down" onclick="changeDir(0, 1)">▼</button>
        <button class="ctrl-btn" id="btn-right" onclick="changeDir(1, 0)">▶</button>
    </div>

    <div id="game-over">
        KONEC HRY<br>
        <span id="final-score" style="font-size: 24px; color: #fff;"></span><br>
        <button onclick="restartGame()">Hrát znovu</button>
    </div>

    <!-- Načtení Three.js z CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let snake = [];
        let snakeDirection = { x: 1, z: 0 };
        let nextDirection = { x: 1, z: 0 };
        let food = null;
        let obstacles = [];
        let enemySnakes = [];
        
        let score = 0;
        let gameInterval = 120; // Rychlost hry v ms
        let lastTime = 0;
        let isGameOver = false;

        const boardLimit = 16; // Velikost hrací plochy

        function init() {
            // Scéna a kamera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0f18, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Zesvětlené osvětlení plochy
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // Silné hlavní světlo nad středem desky pro lepší viditelnost
            const mainLight = new THREE.PointLight(0xffffff, 1.5, 60);
            mainLight.position.set(0, 25, 5);
            scene.add(mainLight);

            // Doplňkové barevné světlo pro atmosféru
            const secondaryLight = new THREE.PointLight(0x3366ff, 0.8, 50);
            secondaryLight.position.set(-10, 15, -10);
            scene.add(secondaryLight);

            // Vytvoření hrací desky
            createBoard();

            // Inicializace prvků hry
            resetGameData();
            spawnFood();
            spawnObstacles();
            
            spawnEnemySnakeWithLength(snake.length + 1);
            spawnEnemySnakeWithLength(snake.length + 1);

            // Posluchače událostí
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleKeyPress);

            // Spuštění smyčky
            requestAnimationFrame(gameLoop);
        }

        // Nastavení kamery: při užším okně / 1x1 výrazně oddálit, při širším zachovat původní
        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1.1) {
                // Užší nebo čtvercové okno (1x1) -> výrazně větší oddálení
                camera.position.set(0, 38, 30);
            } else {
                // Širší okno (PC) -> nechat standardní pohled
                camera.position.set(0, 22, 18);
            }
            camera.lookAt(0, 0, 0);
        }

        function createBoard() {
            const geometry = new THREE.PlaneGeometry(boardLimit * 2, boardLimit * 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x18202c, 
                roughness: 0.7,
                metalness: 0.2 
            });
            const board = new THREE.Mesh(geometry, material);
            board.rotation.x = -Math.PI / 2;
            board.position.y = -0.5;
            scene.add(board);

            const gridHelper = new THREE.GridHelper(boardLimit * 2, boardLimit * 2, 0x446688, 0x223344);
            gridHelper.position.y = -0.49;
            scene.add(gridHelper);
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function resetGameData() {
            snake.forEach(part => scene.remove(part.mesh));
            obstacles.forEach(obs => scene.remove(obs.mesh));
            enemySnakes.forEach(enemy => enemy.parts.forEach(p => scene.remove(p.mesh)));
            if (food) scene.remove(food.mesh);

            snake = [];
            obstacles = [];
            enemySnakes = [];
            score = 0;
            isGameOver = false;

            snakeDirection = { x: 1, z: 0 };
            nextDirection = { x: 1, z: 0 };

            document.getElementById('game-over').style.display = 'none';
            updateUI();

            for (let i = 0; i < 3; i++) {
                addSnakePart(-i, 0);
            }
        }

        function addSnakePart(x, z) {
            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const material = new THREE.MeshStandardMaterial({ 
                color: snake.length === 0 ? 0x00ff88 : 0x00cc66,
                roughness: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            snake.push({ x, z, mesh });
        }

        function spawnFood() {
            if (food) scene.remove(food.mesh);
            const x = getRandomInt(-boardLimit + 2, boardLimit - 2);
            const z = getRandomInt(-boardLimit + 2, boardLimit - 2);
            
            const geometry = new THREE.DodecahedronGeometry(0.5);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xff3366, 
                emissive: 0xff0044,
                emissiveIntensity: 0.6,
                roughness: 0.2 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            food = { x, z, mesh };
        }

        function spawnObstacles() {
            for (let i = 0; i < 5; i++) {
                const x = getRandomInt(-boardLimit + 3, boardLimit - 3);
                const z = getRandomInt(-boardLimit + 3, boardLimit - 3);
                
                const geometry = new THREE.CylinderGeometry(0.4, 0.6, 1.5, 6);
                const material = new THREE.MeshStandardMaterial({ color: 0x667788, roughness: 0.4 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, 0.25, z);
                scene.add(mesh);
                obstacles.push({ x, z, mesh });
            }
        }

        function spawnEnemySnakeWithLength(targetLength) {
            const enemyParts = [];
            const startX = getRandomInt(-boardLimit + 5, boardLimit - 5);
            const startZ = getRandomInt(-boardLimit + 5, boardLimit - 5);

            for(let i = 0; i < targetLength; i++) {
                const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const material = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(startX - i, 0, startZ);
                scene.add(mesh);
                enemyParts.push({ x: startX - i, z: startZ, mesh });
            }
            enemySnakes.push({ parts: enemyParts, dir: { x: 1, z: 0 }, moveTimer: 0 });
        }

        function changeDir(x, z) {
            if (snakeDirection.x !== -x || snakeDirection.z !== -z) {
                if ((x !== 0 && snakeDirection.x === 0) || (z !== 0 && snakeDirection.z === 0)) {
                    nextDirection = { x, z };
                }
            }
        }

        function handleKeyPress(e) {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (snakeDirection.z === 0) nextDirection = { x: 0, z: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (snakeDirection.z === 0) nextDirection = { x: 0, z: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (snakeDirection.x === 0) nextDirection = { x: -1, z: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (snakeDirection.x === 0) nextDirection = { x: 1, z: 0 };
                    break;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            snakeDirection = nextDirection;

            const head = snake[0];
            let newX = head.x + snakeDirection.x;
            let newZ = head.z + snakeDirection.z;

            if (newX > boardLimit) newX = -boardLimit;
            else if (newX < -boardLimit) newX = boardLimit;
            if (newZ > boardLimit) newZ = -boardLimit;
            else if (newZ < -boardLimit) newZ = boardLimit;

            for (let obs of obstacles) {
                if (obs.x === newX && obs.z === newZ) {
                    triggerGameOver();
                    return;
                }
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === newX && snake[i].z === newZ) {
                    triggerGameOver();
                    return;
                }
            }

            function isPlayerAt(x, z) {
                return snake.some(part => part.x === x && part.z === z);
            }

            for (let eIndex = enemySnakes.length - 1; eIndex >= 0; eIndex--) {
                let enemy = enemySnakes[eIndex];
                enemy.moveTimer++;
                if (enemy.moveTimer > 2) {
                    enemy.moveTimer = 0;
                    
                    const possibleDirs = [{x:1, z:0}, {x:-1, z:0}, {x:0, z:1}, {x:0, z:-1}];
                    let validDirs = possibleDirs.filter(d => !(d.x === -enemy.dir.x && d.z === -enemy.dir.z));
                    
                    if (food) {
                        let bestDir = enemy.dir;
                        let minDist = Infinity;
                        for (let d of validDirs) {
                            let nextEX = enemy.parts[0].x + d.x;
                            let nextEZ = enemy.parts[0].z + d.z;
                            let dist = Math.abs(nextEX - food.x) + Math.abs(nextEZ - food.z);
                            if (dist < minDist) {
                                minDist = dist;
                                bestDir = d;
                            }
                        }
                        if (Math.random() < 0.75) enemy.dir = bestDir;
                        else enemy.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                    }
                    
                    let eHeadX = enemy.parts[0].x + enemy.dir.x;
                    let eHeadZ = enemy.parts[0].z + enemy.dir.z;

                    if (eHeadX > boardLimit) eHeadX = -boardLimit;
                    else if (eHeadX < -boardLimit) eHeadX = boardLimit;
                    if (eHeadZ > boardLimit) eHeadZ = -boardLimit;
                    else if (eHeadZ < -boardLimit) eHeadZ = boardLimit;

                    let hitsPlayer = isPlayerAt(eHeadX, eHeadZ);

                    if (hitsPlayer) {
                        if (snake.length > enemy.parts.length) {
                            let enemyLength = enemy.parts.length;
                            enemy.parts.forEach(p => scene.remove(p.mesh));
                            enemySnakes.splice(eIndex, 1);
                            
                            let lastTail = snake[snake.length - 1];
                            for (let k = 0; k < enemyLength; k++) {
                                addSnakePart(lastTail.x, lastTail.z);
                            }

                            score += enemyLength * 10;
                            updateUI();

                            let newTargetLength = snake.length + 1;
                            spawnEnemySnakeWithLength(newTargetLength);
                            spawnEnemySnakeWithLength(newTargetLength);
                            continue;
                        } else {
                            let safeDirs = possibleDirs.filter(d => {
                                let testX = enemy.parts[0].x + d.x;
                                let testZ = enemy.parts[0].z + d.z;
                                if (d.x === -enemy.dir.x && d.z === -enemy.dir.z) return false;
                                if (isPlayerAt(testX, testZ)) return false;
                                for (let obs of obstacles) {
                                    if (obs.x === testX && obs.z === testZ) return false;
                                }
                                return true;
                            });

                            if (safeDirs.length > 0) {
                                enemy.dir = safeDirs[Math.floor(Math.random() * safeDirs.length)];
                                eHeadX = enemy.parts[0].x + enemy.dir.x;
                                eHeadZ = enemy.parts[0].z + enemy.dir.z;
                            } else {
                                enemy.parts.forEach(p => scene.remove(p.mesh));
                                enemySnakes.splice(eIndex, 1);
                                spawnEnemySnakeWithLength(snake.length + 1);
                                continue;
                            }
                        }
                    }

                    let eTailX = enemy.parts[enemy.parts.length - 1].x;
                    let eTailZ = enemy.parts[enemy.parts.length - 1].z;

                    for (let i = enemy.parts.length - 1; i > 0; i--) {
                        enemy.parts[i].x = enemy.parts[i-1].x;
                        enemy.parts[i].z = enemy.parts[i-1].z;
                        enemy.parts[i].mesh.position.set(enemy.parts[i].x, 0, enemy.parts[i].z);
                    }
                    enemy.parts[0].x = eHeadX;
                    enemy.parts[0].z = eHeadZ;
                    enemy.parts[0].mesh.position.set(eHeadX, 0, eHeadZ);

                    if (food && eHeadX === food.x && eHeadZ === food.z) {
                        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                        const material = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.position.set(eTailX, 0, eTailZ);
                        scene.add(mesh);
                        enemy.parts.push({ x: eTailX, z: eTailZ, mesh });
                        spawnFood();
                    }
                }

                for (let part of enemy.parts) {
                    if (part.x === newX && part.z === newZ) {
                        if (snake.length > enemy.parts.length) {
                            let enemyLength = enemy.parts.length;
                            enemy.parts.forEach(p => scene.remove(p.mesh));
                            enemySnakes.splice(eIndex, 1);
                            
                            let lastTail = snake[snake.length - 1];
                            for (let k = 0; k < enemyLength; k++) {
                                addSnakePart(lastTail.x, lastTail.z);
                            }

                            score += enemyLength * 10;
                            updateUI();

                            let newTargetLength = snake.length + 1;
                            spawnEnemySnakeWithLength(newTargetLength);
                            spawnEnemySnakeWithLength(newTargetLength);
                        } else {
                            triggerGameOver();
                            return;
                        }
                        break;
                    }
                }
            }

            let tailX = snake[snake.length - 1].x;
            let tailZ = snake[snake.length - 1].z;

            for (let i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i - 1].x;
                snake[i].z = snake[i - 1].z;
                snake[i].mesh.position.set(snake[i].x, 0, snake[i].z);
            }

            snake[0].x = newX;
            snake[0].z = newZ;
            snake[0].mesh.position.set(newX, 0, newZ);

            if (food && newX === food.x && newZ === food.z) {
                score += 10;
                addSnakePart(tailX, tailZ);
                spawnFood();
                updateUI();
            }

            if (food) {
                food.mesh.rotation.x += 0.02;
                food.mesh.rotation.y += 0.03;
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Dosažené skóre: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            resetGameData();
            spawnFood();
            spawnObstacles();
            spawnEnemySnakeWithLength(snake.length + 1);
            spawnEnemySnakeWithLength(snake.length + 1);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('length').innerText = snake.length;
        }

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);

            const delta = time - lastTime;
            if (delta > gameInterval) {
                updateGame();
                lastTime = time;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            updateCameraPosition();
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
