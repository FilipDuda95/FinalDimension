<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Had s přechody</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Vinetace / přechod do černé po stranách */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px 40px rgba(0, 0, 0, 0.95),
                        inset 0 0 200px 80px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            z-index: 20;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            z-index: 30;
            display: none;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        #game-over button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 20px;
            background: #ff3333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #game-over button:hover {
            background: #ff5555;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    
    <div id="ui">
        Skóre: <span id="score">0</span> | Délka hada: <span id="length">3</span>
    </div>

    <div id="game-over">
        KONEC HRY<br>
        <span id="final-score" style="font-size: 24px; color: #fff;"></span><br>
        <button onclick="restartGame()">Hrát znovu</button>
    </div>

    <!-- Načtení Three.js z CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let snake = [];
        let snakeDirection = { x: 1, z: 0 };
        let nextDirection = { x: 1, z: 0 };
        let food = null;
        let obstacles = [];
        let enemySnakes = [];
        
        let score = 0;
        let gameInterval = 120; // Rychlost hry v ms
        let lastTime = 0;
        let isGameOver = false;

        const boardLimit = 16; // Velikost hrací plochy

        function init() {
            // Scéna a kamera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 22, 18);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Osvětlení
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 50);
            pointLight.position.set(0, 20, 10);
            scene.add(pointLight);

            // Vytvoření hrací desky
            createBoard();

            // Inicializace prvků hry
            resetGameData();
            spawnFood();
            spawnObstacles();
            spawnEnemySnakes();

            // Posluchače událostí
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleKeyPress);

            // Spuštění smyčky
            requestAnimationFrame(gameLoop);
        }

        function createBoard() {
            const geometry = new THREE.PlaneGeometry(boardLimit * 2, boardLimit * 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x11161d, 
                roughness: 0.8,
                metalness: 0.2 
            });
            const board = new THREE.Mesh(geometry, material);
            board.rotation.x = -Math.PI / 2;
            board.position.y = -0.5;
            scene.add(board);

            const gridHelper = new THREE.GridHelper(boardLimit * 2, boardLimit * 2, 0x334455, 0x1a222d);
            gridHelper.position.y = -0.49;
            scene.add(gridHelper);
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function resetGameData() {
            // Vyčištění starých objektů z předchozí hry
            snake.forEach(part => scene.remove(part.mesh));
            obstacles.forEach(obs => scene.remove(obs.mesh));
            enemySnakes.forEach(enemy => enemy.parts.forEach(p => scene.remove(p.mesh)));
            if (food) scene.remove(food.mesh);

            snake = [];
            obstacles = [];
            enemySnakes = [];
            score = 0;
            isGameOver = false;

            // Reset směru hada na výchozí
            snakeDirection = { x: 1, z: 0 };
            nextDirection = { x: 1, z: 0 };

            document.getElementById('game-over').style.display = 'none';
            updateUI();

            // Vytvoření počátečního hada
            for (let i = 0; i < 3; i++) {
                addSnakePart(-i, 0);
            }
        }

        function addSnakePart(x, z) {
            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const material = new THREE.MeshStandardMaterial({ 
                color: snake.length === 0 ? 0x00ff88 : 0x00cc66,
                roughness: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            snake.push({ x, z, mesh });
        }

        function spawnFood() {
            if (food) scene.remove(food.mesh);
            const x = getRandomInt(-boardLimit + 2, boardLimit - 2);
            const z = getRandomInt(-boardLimit + 2, boardLimit - 2);
            
            const geometry = new THREE.DodecahedronGeometry(0.5);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xff3366, 
                emissive: 0xff0044,
                emissiveIntensity: 0.5,
                roughness: 0.2 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            food = { x, z, mesh };
        }

        function spawnObstacles() {
            for (let i = 0; i < 5; i++) {
                const x = getRandomInt(-boardLimit + 3, boardLimit - 3);
                const z = getRandomInt(-boardLimit + 3, boardLimit - 3);
                
                const geometry = new THREE.CylinderGeometry(0.4, 0.6, 1.5, 6);
                const material = new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.5 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, 0.25, z);
                scene.add(mesh);
                obstacles.push({ x, z, mesh });
            }
        }

        function spawnEnemySnakes() {
            const enemyParts = [];
            const startX = -10, startZ = -10;
            for(let i = 0; i < 5; i++) {
                const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const material = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(startX - i, 0, startZ);
                scene.add(mesh);
                enemyParts.push({ x: startX - i, z: startZ, mesh });
            }
            enemySnakes.push({ parts: enemyParts, dir: { x: 1, z: 0 }, moveTimer: 0 });
        }

        function handleKeyPress(e) {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (snakeDirection.z === 0) nextDirection = { x: 0, z: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (snakeDirection.z === 0) nextDirection = { x: 0, z: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (snakeDirection.x === 0) nextDirection = { x: -1, z: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (snakeDirection.x === 0) nextDirection = { x: 1, z: 0 };
                    break;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            snakeDirection = nextDirection;

            const head = snake[0];
            let newX = head.x + snakeDirection.x;
            let newZ = head.z + snakeDirection.z;

            // 1. Průchod stěnami (wrap-around) místo prohry
            if (newX > boardLimit) newX = -boardLimit;
            else if (newX < -boardLimit) newX = boardLimit;

            if (newZ > boardLimit) newZ = -boardLimit;
            else if (newZ < -boardLimit) newZ = boardLimit;

            // 2. Kontrola nárazu do překážek
            for (let obs of obstacles) {
                if (obs.x === newX && obs.z === newZ) {
                    triggerGameOver();
                    return;
                }
            }

            // 3. Kontrola nárazu do sebe sama
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === newX && snake[i].z === newZ) {
                    triggerGameOver();
                    return;
                }
            }

            // 4. Kontrola a pohyb nepřátelských hadů
            for (let eIndex = enemySnakes.length - 1; eIndex >= 0; eIndex--) {
                let enemy = enemySnakes[eIndex];
                enemy.moveTimer++;
                if (enemy.moveTimer > 2) {
                    enemy.moveTimer = 0;
                    if (Math.random() < 0.3) {
                        const dirs = [{x:1, z:0}, {x:-1, z:0}, {x:0, z:1}, {x:0, z:-1}];
                        enemy.dir = dirs[Math.floor(Math.random() * dirs.length)];
                    }
                    
                    let eHeadX = enemy.parts[0].x + enemy.dir.x;
                    let eHeadZ = enemy.parts[0].z + enemy.dir.z;

                    // I nepřátelé mohou procházet zdmi
                    if (eHeadX > boardLimit) eHeadX = -boardLimit;
                    else if (eHeadX < -boardLimit) eHeadX = boardLimit;
                    if (eHeadZ > boardLimit) eHeadZ = -boardLimit;
                    else if (eHeadZ < -boardLimit) eHeadZ = boardLimit;

                    for (let i = enemy.parts.length - 1; i > 0; i--) {
                        enemy.parts[i].x = enemy.parts[i-1].x;
                        enemy.parts[i].z = enemy.parts[i-1].z;
                        enemy.parts[i].mesh.position.set(enemy.parts[i].x, 0, enemy.parts[i].z);
                    }
                    enemy.parts[0].x = eHeadX;
                    enemy.parts[0].z = eHeadZ;
                    enemy.parts[0].mesh.position.set(eHeadX, 0, eHeadZ);
                }

                // Kontrola kolize hlavy hráče s nepřítelem
                for (let part of enemy.parts) {
                    if (part.x === newX && part.z === newZ) {
                        if (snake.length > enemy.parts.length) {
                            enemy.parts.forEach(p => scene.remove(p.mesh));
                            enemySnakes.splice(eIndex, 1);
                            score += 50;
                            updateUI();
                        } else {
                            triggerGameOver();
                            return;
                        }
                        break;
                    }
                }
            }

            // Uložení pozice konce hada pro případné prodloužení
            let tailX = snake[snake.length - 1].x;
            let tailZ = snake[snake.length - 1].z;

            // Posun těla hada
            for (let i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i - 1].x;
                snake[i].z = snake[i - 1].z;
                snake[i].mesh.position.set(snake[i].x, 0, snake[i].z);
            }

            snake[0].x = newX;
            snake[0].z = newZ;
            snake[0].mesh.position.set(newX, 0, newZ);

            // 5. Kontrola sebrání jídla
            if (food && newX === food.x && newZ === food.z) {
                score += 10;
                addSnakePart(tailX, tailZ);
                spawnFood();
                updateUI();
            }

            if (food) {
                food.mesh.rotation.x += 0.02;
                food.mesh.rotation.y += 0.03;
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Dosažené skóre: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            resetGameData();
            spawnFood();
            spawnObstacles();
            spawnEnemySnakes();
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('length').innerText = snake.length;
        }

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);

            const delta = time - lastTime;
            if (delta > gameInterval) {
                updateGame();
                lastTime = time;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
